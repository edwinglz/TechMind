{#- Layout for pages inside the product (login required). -#}
{% extends "base.html" %}
{% from "macros.html" import logo %}
{% block body %}
<header class="bg-white border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
    <a href="/app" class="flex items-center gap-2 min-w-0">
      {{ logo() }}
      <span class="font-semibold">TechMind</span>
      <span class="hidden sm:inline text-slate-400 truncate">· {{ company.name }}</span>
    </a>
    <div class="flex items-center gap-3 text-sm">
      <span class="text-slate-600 truncate">{{ display_name(user) }}</span>
      <form method="post" action="/logout">
        <button class="text-indigo-600 hover:underline whitespace-nowrap">Log out</button>
      </form>
    </div>
  </div>
</header>
<main class="max-w-6xl mx-auto px-4 py-6">
  {% block content %}{% endblock %}
</main>
{% endblock %}
