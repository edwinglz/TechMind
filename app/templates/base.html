{#- Bare page shell shared by every page: <head>, CDN scripts, body styling. -#}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TechMind{% endblock %}</title>
  <meta name="description" content="TechMind turns vague equipment problem reports into diagnostic briefs before anyone is dispatched.">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  {% block body %}{% endblock %}
</body>
</html>
