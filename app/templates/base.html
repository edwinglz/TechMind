{#- Bare page shell shared by every page. Fonts, styles and htmx are bundled locally (no CDN). -#}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}TechMind{% endblock %}</title>
  <meta name="description" content="TechMind turns vague equipment problem reports into diagnostic briefs before anyone is dispatched.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Cpath d='M9 3h14v20H9l-6-6V9z' fill='%23f2b91f'/%3E%3Ccircle cx='8.5' cy='13' r='2.3' fill='%231b2730'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  {% block body %}{% endblock %}
  <div class="toast" id="toast" role="alert" hidden></div>
  <script>
    // When an action fails (server error, lost connection), say so instead of silently doing nothing.
    (function () {
      const toast = document.getElementById("toast");
      let timer;
      function show(text) {
        toast.textContent = text; toast.hidden = false;
        clearTimeout(timer); timer = setTimeout(() => { toast.hidden = true; }, 7000);
      }
      document.addEventListener("htmx:responseError", (e) => {
        if (e.detail.elt && e.detail.elt.id === "chat-poll") return;
        const code = e.detail.xhr ? e.detail.xhr.status : "";
        show(code === 403 ? "You don't have access to that." :
             `That didn't go through (error ${code}). Wait a moment and try again.`);
      });
      document.addEventListener("htmx:sendError", (e) => {
        if (e.detail.elt && e.detail.elt.id === "chat-poll") return;
        show("Couldn't reach TechMind. Check the connection and try again.");
      });
    })();
  </script>
</body>
</html>
