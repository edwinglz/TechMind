{% extends "base.html" %}
{% from "macros.html" import logo %}
{% block title %}Log in · TechMind{% endblock %}
{% block body %}
<div class="min-h-screen flex flex-col items-center justify-center px-4 py-12">
  <a href="/" class="flex items-center gap-2">
    {{ logo("h-10 w-10") }}
    <span class="text-xl font-semibold">TechMind</span>
  </a>

  <form method="post" action="/login" class="mt-8 w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-lg font-semibold">Log in to your workspace</h1>

    {% if error %}
    <p class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ error }}</p>
    {% endif %}

    <label class="mt-4 block text-sm font-medium" for="username">Username</label>
    <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus
           autocapitalize="none" spellcheck="false"
           class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">

    <label class="mt-4 block text-sm font-medium" for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required
           class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">

    <button class="mt-6 w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-medium text-white hover:bg-indigo-700">Log in</button>
  </form>

  <a href="/" class="mt-6 text-sm text-slate-500 hover:underline">← Back to TechMind</a>
</div>
{% endblock %}
